services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nbytes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nbytes}
      POSTGRES_DB: ${POSTGRES_DB:-nbytes}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned folder under this path (PGDATA=/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nbytes} -d ${POSTGRES_DB:-nbytes}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
